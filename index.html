<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#14213d" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070c18" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- INTENTIONAL: runs before first paint so a dark reader never sees a light flash. Key shared with src/lib/theme.js. -->
    <script>
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <!-- INTENTIONAL: the theme button only works with JavaScript, so without it there is no button to offer. Two classes
         because the stylesheet comes after this and sets the button's display with one. -->
    <noscript><style>.bar .bar-theme { display: none; }</style></noscript>
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
